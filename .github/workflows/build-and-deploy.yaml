name: Build and deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

jobs:
  jar-app:
    uses: navikt/teamesyfo-github-actions-workflows/.github/workflows/jar-app.yaml@main
    permissions:
      actions: read
      contents: write
      security-events: write
      packages: write
      id-token: write
    secrets: inherit
    with:
      app: dinesykmeldte-backend
      java-version: '21'

  deploy-alerts-dev:
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false }}
    name: Deploy alerts to dev
    runs-on: ubuntu-latest
    needs: [jar-app]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/alerts-dev.yaml

  deploy-alerts-prod:
    if: github.ref_name == 'main'
    name: Deploy alerts to prod
    runs-on: ubuntu-latest
    needs: [jar-app]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891 # v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: nais/alerts-prod.yaml
