name: Deploy Valkey
on:
  push:
    branches:
      - main
    paths:
      - nais/valkey.yaml
      - .github/workflows/deploy-valkey.yaml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-valkey
  cancel-in-progress: false

jobs:
  deploy-valkey-to-dev:
    if: github.ref == 'refs/heads/main'
    name: Deploy Valkey to dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nais CLI
        uses: nais/setup@077e7ecb2c8b5fbf99a7229c7512f7b04092f09b # v1
      - name: Apply Valkey manifest
        run: nais apply nais/valkey.yaml --team team-esyfo --environment dev-gcp

  deploy-valkey-to-prod:
    if: github.ref == 'refs/heads/main'
    name: Deploy Valkey to prod
    needs: [deploy-valkey-to-dev]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nais CLI
        uses: nais/setup@077e7ecb2c8b5fbf99a7229c7512f7b04092f09b # v1
      - name: Apply Valkey manifest
        run: nais apply nais/valkey.yaml --team team-esyfo --environment prod-gcp
